<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaxis · Stock — v4</title>
<style>
  :root{
    --blue:#2C4E96; --blue-soft:#E6ECF8; --blue-border:#B9C7E6;
    --green:#0C9E90; --green-soft:#E1F5EE; --green-border:#9FE1CB;
    --red:#D14343; --red-soft:#FBEAEA; --red-border:#F2B8B8;
    --amber:#B45309; --amber-soft:#FEF3E2; --amber-border:#FCE0B0;
    --bg:#F5F7F7; --card:#FFFFFF; --line:#E4E8EC;
    --text:#16242C; --text-mute:#6B7A80;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#EEF2F2 0%,#E4EAEA 100%); color:var(--text);
    padding:28px 16px 60px; display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .intro{max-width:640px;text-align:center;}
  .intro h1{font-size:18px;margin:0 0 6px;}
  .intro p{margin:0;font-size:13px;color:var(--text-mute);line-height:1.55;}

  .switcher{display:flex;flex-wrap:wrap;gap:6px;background:var(--card);padding:6px;border-radius:12px;border:1px solid var(--line);max-width:640px;justify-content:center;}
  .switcher button{border:none;background:transparent;padding:8px 12px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--text-mute);cursor:pointer;}
  .switcher button.active{background:#0F2A3D;color:#fff;}

  .frame{width:360px;background:var(--card);border-radius:20px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(15,42,61,0.18);overflow:hidden;display:flex;flex-direction:column;height:700px;position:relative;}

  .topbar{background:#fff;padding:14px 16px 10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:8px;flex-shrink:0;}
  .topbar .left{font-weight:700;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .center{text-align:center;}
  .topbar .brand{font-weight:800;font-size:17px;color:var(--blue);letter-spacing:0.4px;}
  .topbar .sub{display:flex;align-items:center;justify-content:center;gap:5px;font-size:10px;font-weight:600;color:var(--text-mute);margin-top:2px;}
  .topbar .sub .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;}
  .topbar .right{text-align:right;color:var(--text);}

  .content{flex:1;overflow-y:auto;padding:12px 12px 16px;}
  .content::-webkit-scrollbar{display:none;}

  .pill-tabs{display:flex;gap:6px;margin-bottom:10px;}
  .pill{flex:1;text-align:center;padding:8px 4px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--text-mute);cursor:pointer;}
  .pill.active{background:var(--blue);color:#fff;border-color:var(--blue);}

  .row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
  .row-head .desc{font-size:11.5px;color:var(--text-mute);line-height:1.4;}
  .btn-add{background:var(--blue);color:#fff;border:none;border-radius:999px;font-size:11px;font-weight:700;padding:8px 14px;white-space:nowrap;cursor:pointer;}

  .search{height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;padding:0 10px;font-size:12px;color:#94a3b8;margin-bottom:10px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;}
  .card.clickable{cursor:pointer;}

  /* ===== MATERIAL ROW v4: 3 iconos compactos, sin texto ni kebab ===== */
  .mat-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .mat-name{font-size:13.5px;font-weight:700;color:var(--text);}
  .mat-meta{font-size:11px;color:var(--text-mute);margin-top:2px;}
  .mat-meta.low{color:var(--amber);font-weight:700;}
  .mat-price{font-size:11px;color:var(--text-mute);margin-top:2px;}
  .icon-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{width:34px;height:34px;border-radius:9999px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .icon-btn.swap{background:#F1F5F9;}
  .icon-btn.edit{background:var(--blue-soft);color:var(--blue);}

  .form-title{font-size:13px;font-weight:800;margin-bottom:10px;color:var(--text);}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--text-mute);margin-bottom:4px;}
  .field input,.field select{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);padding:0 10px;font-size:12.5px;color:var(--text);background:#fff;}
  .field-row{display:flex;gap:8px;}
  .field-row .field{flex:1;}
  .form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;}
  .btn-secondary{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:11.5px;font-weight:700;color:var(--text-mute);cursor:pointer;}
  .btn-primary{border:none;border-radius:999px;padding:8px 16px;font-size:11.5px;font-weight:700;color:#fff;cursor:pointer;}
  .btn-outline-blue{background:#fff;border:1.5px solid var(--blue);color:var(--blue);border-radius:999px;padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer;}

  .toggle{display:flex;border-radius:12px;background:#f1f5f9;padding:4px;gap:4px;margin-bottom:14px;}
  .toggle button{flex:1;border:none;border-radius:9px;padding:12px 0;font-size:13px;font-weight:800;background:transparent;color:var(--text-mute);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
  .toggle button.sel-in{background:var(--green);color:#fff;}
  .toggle button.sel-out{background:var(--red);color:#fff;}

  .mov-sub{font-size:12px;color:var(--text-mute);margin-bottom:12px;}
  .mov-sub b{color:var(--text);}

  .sheet-overlay{position:absolute;inset:0;background:rgba(15,23,42,0.4);display:none;align-items:flex-end;z-index:50;}
  .sheet-overlay.open{display:flex;}
  .sheet{width:100%;background:#fff;border-radius:20px 20px 0 0;padding:16px;max-height:80%;overflow-y:auto;}
  .sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px;}
  .sheet-box{border-radius:14px;padding:14px;border:1.5px solid;transition:background .15s,border-color .15s;}
  .sheet-box.in{background:var(--green-soft);border-color:var(--green-border);}
  .sheet-box.out{background:var(--red-soft);border-color:var(--red-border);}

  .toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;font-size:12px;font-weight:700;padding:9px 16px;border-radius:999px;z-index:60;display:none;white-space:nowrap;}
  .toast.show{display:block;}

  .filters{display:flex;gap:6px;margin-bottom:10px;}
  .hist-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9;}
  .hist-row:last-child{border-bottom:none;}
  .hist-bar{width:3px;border-radius:2px;flex-shrink:0;}
  .hist-bar.in{background:var(--green);} .hist-bar.out{background:var(--red);} .hist-bar.ret{background:var(--blue);}
  .hist-main{flex:1;min-width:0;}
  .hist-name{font-size:13px;font-weight:700;color:var(--text);}
  .hist-detail{font-size:11px;margin-top:2px;}
  .hist-detail.in{color:var(--green);} .hist-detail.out{color:var(--red);} .hist-detail.ret{color:var(--blue);}
  .hist-date{font-size:10.5px;color:var(--text-mute);margin-top:2px;}

  .summary-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .summary-label{font-size:11px;color:var(--text-mute);margin-bottom:4px;}
  .summary-value{font-size:20px;font-weight:800;color:var(--text);}

  /* total compra: linea simple arriba del form, no caja */
  .total-line{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:10px;margin-bottom:10px;border-bottom:1px dashed var(--blue-border);}
  .total-line .lbl{font-size:11px;font-weight:700;color:var(--text-mute);}
  .total-line .val{font-size:17px;font-weight:800;color:var(--blue);}

  .item-row{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;position:relative;}
  .item-grid{display:grid;grid-template-columns:52px 1fr 84px 24px;gap:6px;align-items:end;}
  .item-grid label{font-size:9.5px;font-weight:700;color:var(--text-mute);display:block;margin-bottom:3px;}
  .item-grid input,.item-grid select{width:100%;height:32px;border-radius:8px;border:1px solid var(--line);padding:0 6px;font-size:11.5px;}
  .item-remove{width:24px;height:24px;border-radius:999px;border:none;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;cursor:pointer;}

  /* formulario de compra con fondo azul, mismo lenguaje que la hoja de movimiento */
  .compra-box{border-radius:14px;padding:14px;border:1.5px solid var(--blue-border);background:var(--blue-soft);}

  .bottombar{border-top:1px solid var(--line);background:#fff;padding:8px 10px;flex-shrink:0;}
  .bn-row{display:flex;align-items:center;justify-content:center;gap:16px;}
  .bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-mute);font-size:9px;font-weight:700;cursor:pointer;background:none;border:none;}
  .bn-item.active{color:var(--blue);}
  .bn-icon-wrap{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
  .bn-item.active .bn-icon-wrap{background:var(--blue-soft);}
  .bn-create{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--blue);font-size:9px;font-weight:700;background:none;border:none;cursor:pointer;}
  .bn-create .bn-icon-wrap{width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;}

  .note{max-width:640px;background:var(--green-soft);border:1px solid var(--green-border);border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--green);line-height:1.5;}

  svg{display:block;}
</style>
</head>
<body>

<div class="switcher" id="screenSwitcher">
  <button class="active" data-s="bodega">Bodega</button>
  <button data-s="movimientos">Historial movimientos</button>
  <button data-s="compras">Compras</button>
</div>

<div class="frame">
  <div class="topbar">
    <div class="left">Top Racing AC</div>
    <div class="center">
      <div class="brand">KAXIS</div>
      <div class="sub"><span class="dot"></span>Gestionar datos</div>
    </div>
    <div class="right">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </div>
  </div>

  <div class="content" id="content"></div>

  <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheetBackdrop(event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="bottombar">
    <div class="bn-row">
      <button class="bn-item" data-nav="ordenes">
        <span class="bn-icon-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg></span>
        Órdenes
      </button>
      <button class="bn-item" data-nav="contactos">
        <span class="bn-icon-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg></span>
        Contactos
      </button>
      <button class="bn-create">
        <span class="bn-icon-wrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
        Crear orden
      </button>
      <button class="bn-item active" data-nav="stock">
        <span class="bn-icon-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 9v10a2 2 0 01-2 2H5a2 2 0 01-2-2V9"/><path d="M1 5a2 2 0 012-2h18a2 2 0 012 2v4H1V5z"/><line x1="10" y1="13" x2="14" y2="13"/></svg></span>
        Stock
      </button>
      <button class="bn-item" data-nav="finanzas">
        <span class="bn-icon-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg></span>
        Finanzas
      </button>
    </div>
  </div>
</div>

<script>
const MATERIALS = ['aceite 5/30','Alternador modular','Bujías','Bujías BMX'];
const ICONS = {
  in: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 19 19 12"/></svg>',
  out: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 5 5 12"/></svg>',
  edit: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5z"/></svg>',
  swap: '<svg width="18" height="16" viewBox="0 0 28 20" fill="none"><g stroke="#0C9E90" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="4" x2="7" y2="16"/><polyline points="3 12 7 16 11 12"/></g><g stroke="#D14343" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="16" x2="21" y2="4"/><polyline points="17 8 21 4 25 8"/></g></svg>'
};

function materialRow(name, unit, stock, min, cost, venta, low){
  return `
    <div class="card">
      <div class="mat-row">
        <div style="min-width:0;">
          <div class="mat-name">${name}</div>
          <div class="mat-meta ${low?'low':''}">${unit} · Stock ${stock} · Mín. ${min}</div>
          <div class="mat-price">Costo $${cost} · Venta $${venta}</div>
        </div>
        <div class="icon-actions">
          <button class="icon-btn swap" title="Registrar movimiento" onclick="openMovSheet('${name}')">${ICONS.swap}</button>
          <button class="icon-btn edit" title="Editar" onclick="openMaterialSheet(true,'${name}','${unit}',${stock},${min},'${cost}','${venta}')">${ICONS.edit}</button>
        </div>
      </div>
    </div>`;
}

function renderBodega(){
  return `
    <div class="pill-tabs">
      <div class="pill active">Bodega</div><div class="pill">Movimientos</div><div class="pill">Compras</div>
    </div>
    <div class="row-head">
      <div class="desc">Control de materiales, movimientos y registro de compras</div>
      <button class="btn-add" onclick="openMaterialSheet(false)">Agregar</button>
    </div>
    <div class="search">Buscar material</div>
    ${materialRow('aceite 5/30','LT',9,3,'38.000','50.000',false)}
    ${materialRow('Alternador modular','UN',4,5,'10.000','15.000',true)}
    ${materialRow('Bujías','UN',1,0,'1.500','0',false)}
    ${materialRow('Bujías BMX','UN',161,10,'10.000','20.000',false)}
  `;
}

function openMovSheet(materialName){
  const presetType = 'in';
  document.getElementById('sheetBody').innerHTML = `
    <div class="toggle" id="movToggle">
      <button id="btnIn" onclick="setMovType('in')">${ICONS.in} Entrada</button>
      <button id="btnOut" onclick="setMovType('out')">${ICONS.out} Salida</button>
    </div>
    <div class="sheet-box" id="sheetBox">
      <div class="mov-sub" id="movSub"></div>
      <div class="field"><label>Cantidad</label><input placeholder="Ej: 10" autofocus></div>
      <div class="form-actions">
        <button class="btn-secondary" onclick="closeSheet()">Cancelar</button>
        <button class="btn-primary" id="movConfirm" onclick="confirmMov('${materialName}')"></button>
      </div>
    </div>
  `;
  window.__movMaterial = materialName;
  setMovType(presetType || 'in');
  document.getElementById('sheetOverlay').classList.add('open');
}

function setMovType(type){
  const isIn = type === 'in';
  document.getElementById('btnIn').className = isIn ? 'sel-in' : '';
  document.getElementById('btnOut').className = isIn ? '' : 'sel-out';
  document.getElementById('sheetBox').className = 'sheet-box ' + (isIn ? 'in' : 'out');
  document.getElementById('movSub').innerHTML = isIn
    ? `Sumará unidades al stock de <b>${window.__movMaterial}</b>.`
    : `Descontará unidades del stock de <b>${window.__movMaterial}</b>.`;
  const btn = document.getElementById('movConfirm');
  btn.style.background = isIn ? 'var(--green)' : 'var(--red)';
  btn.textContent = isIn ? 'Guardar entrada' : 'Guardar salida';
}

function closeSheet(){ document.getElementById('sheetOverlay').classList.remove('open'); }
function closeSheetBackdrop(e){ if(e.target.id === 'sheetOverlay') closeSheet(); }
function confirmMov(name){
  const isIn = document.getElementById('btnIn').className === 'sel-in';
  closeSheet();
  showToast((isIn ? 'Entrada' : 'Salida') + ' registrada · ' + name);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function openMaterialSheet(editing, name, unit, stock, min, cost, venta){
  const title = editing ? 'Editar material' : 'Nuevo material';
  document.getElementById('sheetBody').innerHTML = `
    <div class="form-title">${title}</div>
    <div class="field"><label>Nombre</label><input id="matName" value="${editing?name:''}" placeholder="Ej: Filtro de aceite"></div>
    <div class="field-row">
      <div class="field"><label>Unidad</label>
        <select id="matUnit">
          <option ${(!editing||unit==='UN')?'selected':''}>UN · Unidad</option>
          <option ${editing&&unit==='LT'?'selected':''}>LT · Litro</option>
        </select>
      </div>
      <div class="field"><label>Stock mínimo</label><input id="matMin" value="${editing?min:''}" placeholder="Ej: 3"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Costo interno</label><input id="matCost" value="${editing?cost:''}" placeholder="Ej: 50.000"></div>
      <div class="field"><label>Precio venta</label><input id="matVenta" value="${editing?venta:''}" placeholder="Ej: 50.000"></div>
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text);margin-bottom:8px;">
      <input type="checkbox" checked style="width:auto;height:auto;"> Activo
    </label>
    <div class="form-actions">
      <button class="btn-secondary" onclick="closeSheet()">Cancelar</button>
      <button class="btn-primary" style="background:var(--blue);" onclick="closeSheet();showToast('${title} guardado')">Guardar</button>
    </div>
  `;
  document.getElementById('sheetOverlay').classList.add('open');
}

function movRow(name, kind, cant, stock, date, ref){
  const cls = kind==='Entrada'?'in':kind==='Salida'?'out':'ret';
  return `<div class="hist-row"><div class="hist-bar ${cls}"></div><div class="hist-main">
    <div class="hist-name">${name}</div>
    <div class="hist-detail ${cls}">${kind} · Cant. ${cant} · Stock ${stock}</div>
    <div class="hist-date">${date} · ${ref}</div></div></div>`;
}

function renderMovimientos(){
  return `
    <div class="pill-tabs"><div class="pill active">Bodega</div><div class="pill">Movimientos</div><div class="pill">Compras</div></div>
    <div class="search">Buscar material</div>
    <div class="filters">
      <div class="pill active" style="flex:none;padding:6px 12px;">Mes</div>
      <div class="pill" style="flex:none;padding:6px 12px;">3 meses</div>
      <div class="pill" style="flex:none;padding:6px 12px;">Todo</div>
    </div>
    <div class="card">
      ${movRow('aceite 5/30','Salida',1,9,'2026-08-07','DHBK27')}
      ${movRow('aceite 5/30','Entrada',10,10,'2026-08-07','Manual')}
      ${movRow('test','Retorno',3,1,'2026-08-06','YK2431')}
      ${movRow('test','Salida',1,-2,'2026-08-05','YK2431')}
    </div>
  `;
}

function purchaseRow(id, prov, total, date, doc){
  return `<div class="hist-row" style="align-items:center;">
    <div class="hist-bar" style="background:var(--blue);"></div>
    <div class="hist-main">
      <div class="hist-name">${prov}</div>
      <div class="hist-detail" style="color:var(--blue);">$${total} · ${doc}</div>
      <div class="hist-date">${date}</div>
    </div>
    <button class="icon-btn edit" title="Editar compra" style="width:30px;height:30px;flex-shrink:0;" onclick="openEditCompraSheet('${id}','${prov}','${total}','${date}','${doc}')">${ICONS.edit}</button>
  </div>`;
}

function renderCompras(){
  return `
    <div class="pill-tabs"><div class="pill active">Bodega</div><div class="pill">Movimientos</div><div class="pill">Compras</div></div>
    <div class="row-head">
      <div class="search" style="flex:1;margin:0;">Buscar compra o proveedor</div>
      <button class="btn-add" onclick="openNuevaCompraSheet()">Agregar</button>
    </div>
    <div class="filters" style="margin-top:10px;">
      <div class="pill active" style="flex:none;padding:6px 12px;">Mes</div>
      <div class="pill" style="flex:none;padding:6px 12px;">3 meses</div>
      <div class="pill" style="flex:none;padding:6px 12px;">Todo</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Total compras</div>
      <div class="summary-value">$85.000</div>
    </div>
    <div class="card">
      ${purchaseRow('1','Repuestos GAZU','65.000','2026-08-10','F-2231')}
      ${purchaseRow('2','prov-reps','20.000','2026-08-03','BOL-9865')}
    </div>
  `;
}

let itemCounter = 0;
function itemRowHtml(id, qty, prodName, price){
  const opts = MATERIALS.map(m=>`<option ${m===prodName?'selected':''}>${m}</option>`).join('') + '<option>Otro material...</option>';
  return `
    <div class="item-row" id="item-${id}">
      <div class="item-grid">
        <div><label>Cant.</label><input type="number" value="${qty}" oninput="recalcTotal()" id="qty-${id}"></div>
        <div><label>Producto</label><select id="prod-${id}">${opts}</select></div>
        <div><label>Precio</label><input type="number" value="${price}" oninput="recalcTotal()" id="price-${id}"></div>
        <button class="item-remove" onclick="removeItem(${id})" title="Quitar">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>`;
}
function addItem(qty, prod, price){
  itemCounter++;
  document.getElementById('itemsList').insertAdjacentHTML('beforeend', itemRowHtml(itemCounter, qty ?? 1, prod ?? MATERIALS[0], price ?? 0));
  recalcTotal();
}
function removeItem(id){
  const el = document.getElementById('item-'+id);
  if(el) el.remove();
  recalcTotal();
}
function recalcTotal(){
  let total = 0;
  document.querySelectorAll('.item-row').forEach(row=>{
    const id = row.id.split('-')[1];
    const qty = Number(document.getElementById('qty-'+id).value) || 0;
    const price = Number(document.getElementById('price-'+id).value) || 0;
    total += qty * price;
  });
  const el = document.getElementById('totalCompraValue');
  if(el) el.textContent = '$' + total.toLocaleString('es-CL');
}

function compraFormHtml(title, proveedor, fecha, doc, items){
  const provOpts = ['Repuestos GAZU','prov-reps'].map(p=>`<option ${p===proveedor?'selected':''}>${p}</option>`).join('');
  return `
    <div class="compra-box">
      <div class="form-title">${title}</div>

      <div class="total-line">
        <span class="lbl">Total compra</span>
        <span class="val" id="totalCompraValue">$0</span>
      </div>

      <div class="field">
        <label>Proveedor</label>
        <select>
          <option>Selecciona un proveedor...</option>
          ${provOpts}
          <option>Otro proveedor...</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label>Fecha</label><input value="${fecha}"></div>
        <div class="field"><label>N° boleta/factura</label><input value="${doc}" placeholder="Ej: F12345"></div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px;">
        <div class="form-title" style="margin:0;">Ítems de la compra</div>
        <button class="btn-outline-blue" onclick="addItem()">+ Agregar ítem</button>
      </div>

      <div id="itemsList"></div>

      <div class="form-actions">
        <button class="btn-secondary" onclick="closeSheet()">Cancelar</button>
        <button class="btn-primary" style="background:var(--blue);" onclick="closeSheet();showToast('Compra guardada')">Guardar compra</button>
      </div>
    </div>
  `;
}

function openNuevaCompraSheet(){
  itemCounter = 0;
  document.getElementById('sheetBody').innerHTML = compraFormHtml('Nueva compra', null, '14/08/2026', '', []);
  document.getElementById('sheetOverlay').classList.add('open');
  setTimeout(()=>{ addItem(); }, 0);
}

function openEditCompraSheet(id, prov, total, date, doc){
  itemCounter = 0;
  document.getElementById('sheetBody').innerHTML = compraFormHtml('Editar compra', prov, date, doc, []);
  document.getElementById('sheetOverlay').classList.add('open');
  setTimeout(()=>{ addItem(1, MATERIALS[2], Number(total.replace(/\./g,''))); }, 0);
}

const SCREENS = { bodega: renderBodega, movimientos: renderMovimientos, compras: renderCompras };

function showScreen(key){
  document.getElementById('content').innerHTML = SCREENS[key]();
  document.querySelectorAll('#screenSwitcher button').forEach(b=>b.classList.toggle('active', b.dataset.s === key));
}

document.getElementById('screenSwitcher').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  closeSheet();
  showScreen(btn.dataset.s);
});

showScreen('bodega');
</script>

</body>
</html>
