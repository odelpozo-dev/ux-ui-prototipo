<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaxis · Navegación homogénea</title>
<style>
  :root{
    --navy:#0F2A3D;
    --blue:#2C4E96;
    --teal:#12B5A6;
    --teal-dark:#0C9E90;
    --teal-soft:#E4F4F2;
    --teal-border:#BFE6DF;
    --bg:#F5F7F7;
    --card:#FFFFFF;
    --line:#E4E8EC;
    --text:#16242C;
    --text-mute:#6B7A80;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#EEF2F2 0%,#E4EAEA 100%);
    color:var(--text);
    padding:32px 16px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }

  .intro{max-width:640px;text-align:center;}
  .intro h1{font-size:19px;margin:0 0 6px;letter-spacing:-0.01em;}
  .intro p{margin:0;font-size:13px;color:var(--text-mute);line-height:1.55;}
  .intro .rule{
    display:inline-block;
    margin-top:10px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 14px;
    font-size:12px;
    font-weight:700;
    color:var(--blue);
  }

  .switcher{
    display:flex;
    gap:6px;
    background:var(--card);
    padding:5px;
    border-radius:12px;
    border:1px solid var(--line);
  }
  .switcher button{
    border:none;
    background:transparent;
    padding:9px 16px;
    border-radius:8px;
    font-size:12.5px;
    font-weight:700;
    color:var(--text-mute);
    cursor:pointer;
  }
  .switcher button.active{background:var(--navy);color:#fff;}

  .phone{
    width:360px;
    height:700px;
    background:#000;
    border-radius:42px;
    padding:12px;
    box-shadow:0 20px 50px rgba(15,42,61,0.25);
    position:relative;
  }
  .screen{
    width:100%;height:100%;
    background:var(--bg);
    border-radius:30px;
    overflow:hidden;
    position:relative;
    display:flex;flex-direction:column;
  }
  .notch{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:90px;height:20px;background:#000;border-radius:12px;z-index:50;
  }

  .topbar{
    background:#fff;
    padding:16px 16px 10px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .topbar-left{display:flex;align-items:center;gap:8px;min-width:0;}
  .back-btn{width:22px;height:22px;color:var(--text);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .brand-row{display:flex;align-items:center;gap:6px;}
  .brand-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;}
  .brand-logo{font-size:15px;font-weight:800;color:var(--blue);letter-spacing:0.5px;}
  .subtitle{font-size:10.5px;color:var(--text-mute);margin-top:1px;}
  .menu-icon{color:var(--text);}

  .content{
    flex:1;
    overflow-y:auto;
    padding:12px 12px 16px;
  }
  .content::-webkit-scrollbar{display:none;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .card-title{font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#475569;font-weight:800;margin:0 0 8px;}
  .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f1f5f9;font-size:12.5px;}
  .row:last-child{border-bottom:none;}
  .row .label{color:var(--text-mute);}
  .row .val{font-weight:700;color:var(--text);}

  /* pills sub-nivel: mismo componente en las dos pantallas */
  .pill-tabs{display:flex;gap:8px;margin-bottom:10px;}
  .pill{
    flex:1;text-align:center;padding:9px 6px;border-radius:20px;
    background:#fff;border:1px solid var(--line);
    font-size:12px;font-weight:700;color:var(--text-mute);cursor:pointer;
  }
  .pill.active{background:var(--blue);color:#fff;border-color:var(--blue);}

  .badge{
    background:var(--teal-soft);color:var(--teal-dark);font-weight:700;font-size:10px;
    padding:3px 10px;border-radius:20px;border:1px solid var(--teal-border);text-transform:uppercase;
  }

  /* bottom nav: dos "vestimentas" para la misma posición, según el significado */

  /* Gestionar Datos: módulos independientes -> íconos sueltos y separados, sin nada que los una */
  .bottomnav{
    display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);
    padding:10px 8px 12px;flex-shrink:0;
  }
  .bn-item{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--text-mute);font-size:9.5px;font-weight:700;cursor:pointer;padding:4px 10px;
  }
  .bn-item.active{color:var(--teal-dark);}
  .bn-item svg{width:20px;height:20px;}

  /* OT: mismo componente pill que el resto de la app, sin fondo especial */
  .segmentnav-wrap{
    background:#fff;border-top:1px solid var(--line);
    padding:10px;flex-shrink:0;
  }
  .segmentnav{display:flex;gap:8px;}
  .seg-item{
    flex:1;text-align:center;padding:9px 6px;border-radius:20px;
    background:#fff;border:1px solid var(--line);
    font-size:12px;font-weight:700;color:var(--text-mute);cursor:pointer;
  }
  .seg-item.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .seg-item svg{display:none;}

  .segmentnav-wrap--top{
    border-top:none;
    border-bottom:1px solid var(--line);
  }

  .caption{max-width:360px;text-align:center;font-size:12px;color:var(--text-mute);line-height:1.5;}
  .caption b{color:var(--text);}
</style>
</head>
<body>

<div class="switcher" id="appSwitcher">
  <button class="active" data-app="ot">Orden de trabajo</button>
  <button data-app="datos">Gestionar datos</button>
</div>

<div class="phone">
  <div class="screen">

    <div class="topbar">
      <div class="topbar-left">
        <div class="back-btn" id="backBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </div>
        <div>
          <div class="brand-row">
            <span class="brand-name">Top Racing AC</span>
            <span class="brand-logo">KAXIS</span>
          </div>
          <div class="subtitle" id="topSubtitle">Mantención Kilometraje</div>
        </div>
      </div>
      <div class="menu-icon" id="hamburgerBtn" style="cursor:pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </div>
    </div>

    <div class="segmentnav-wrap segmentnav-wrap--top" id="segmentnavWrapTop" style="display:none;">
      <div class="segmentnav" id="segmentnavTop"></div>
    </div>

    <div id="orderStrip" style="display:none;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line);align-items:center;justify-content:space-between;gap:8px;position:relative;">
      <div style="min-width:0;">
        <div style="font-size:13px;font-weight:700;color:var(--text);">Raúl</div>
        <div style="font-size:11px;color:var(--text-mute);text-transform:uppercase;">WR1107 · Peugeot Partner</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
        <select id="statusSelect" style="appearance:none;background:var(--teal-soft);color:var(--teal-dark);border:1px solid var(--teal-border);font-size:10px;font-weight:700;padding:4px 20px 4px 10px;border-radius:20px;text-transform:uppercase;">
          <option>Abierta</option>
          <option selected>Ejecución</option>
          <option>Cerrada</option>
        </select>
        <div id="shareBtn" style="cursor:pointer;color:var(--blue);display:flex;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
        </div>
      </div>

      <div id="shareMenu" style="display:none;position:absolute;top:48px;right:0;width:220px;background:#fff;border-radius:14px;box-shadow:0 12px 28px rgba(15,42,61,0.2);padding:6px;z-index:60;">
        <div style="display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;cursor:pointer;">
          <div style="width:32px;height:32px;border-radius:9px;background:#E7F8EF;color:#25D366;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.6-.8-1.9-.9-.3-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.5.1-.3-.1-1.1-.4-2.1-1.3-.8-.7-1.3-1.6-1.5-1.8-.2-.3 0-.4.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.3 0 1.4 1 2.7 1.1 2.9.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.6-.7 1.9-1.3.2-.6.2-1.1.2-1.3-.1-.1-.3-.2-.5-.3z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.3c1.4.8 3.1 1.2 4.8 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.1.8.8-3-.2-.3C4 14.9 3.6 13.5 3.6 12c0-4.6 3.8-8.4 8.4-8.4s8.4 3.8 8.4 8.4-3.8 8.2-8.4 8.2z"/></svg>
          </div>
          <div><div style="font-size:12.5px;font-weight:700;color:var(--text);">WhatsApp</div><div style="font-size:10px;color:var(--text-mute);">Enviar orden al cliente</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;cursor:pointer;">
          <div style="width:32px;height:32px;border-radius:9px;background:#FDEDEA;color:#E15241;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
          </div>
          <div><div style="font-size:12.5px;font-weight:700;color:var(--text);">Descargar PDF</div><div style="font-size:10px;color:var(--text-mute);">Generar PDF</div></div>
        </div>
      </div>
    </div>

    <div class="content" id="content"></div>

    <div class="bottomnav" id="bottomnav" style="display:none;"></div>
  </div>
</div>

<script>
const ICONS = {
  ficha: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  trabajos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>',
  imagenes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
  pagos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>',
  contactos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>',
  stock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
  finanzas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>'
};

const APPS = {
  ot: {
    subtitle: 'Mantención Kilometraje',
    sections: [
      {key:'ficha', label:'Ficha'},
      {key:'trabajos', label:'Trabajos'},
      {key:'imagenes', label:'Imágenes'},
      {key:'pagos', label:'Pagos'}
    ],
    defaultSection: 'trabajos'
  },
  datos: {
    subtitle: 'Gestionar datos',
    sections: [
      {key:'contactos', label:'Contactos'},
      {key:'stock', label:'Stock'},
      {key:'finanzas', label:'Finanzas'}
    ],
    defaultSection: 'stock'
  }
};

let currentApp = 'ot';
let activeSection = APPS.ot.defaultSection;
let subPill = { trabajos: 'mano', stock: 'bodega', contactos: 'mecanicos' };

function renderOTContent(section, sub){
  if(section==='ficha'){
    return `
      <div class="card">
        <div class="card-title">Datos del cliente</div>
        <div class="row"><span class="label">Nombre</span><span class="val">Raúl</span></div>
        <div class="row"><span class="label">Teléfono</span><span class="val">+56 8 7463 6398</span></div>
      </div>
      <div class="card">
        <div class="card-title">Datos del vehículo</div>
        <div class="row"><span class="label">Patente</span><span class="val">WR1107</span></div>
        <div class="row"><span class="label">Marca</span><span class="val">Peugeot</span></div>
      </div>`;
  }
  if(section==='trabajos'){
    const manoObra = `
      <div class="card">
        <div class="row"><span class="label">Aditivo limpieza inyectores</span><span class="val">$2.200</span></div>
        <div class="row"><span class="label">Lavado de motor</span><span class="val">$10.000</span></div>
        <div class="row"><span class="label">Cambio filtro polen</span><span class="val">$45.000</span></div>
      </div>`;
    const repuestos = `
      <div class="card">
        <div class="row"><span class="label">Filtro de polen</span><span class="val">$12.000</span></div>
      </div>`;
    return `
      <div class="pill-tabs" id="subTabs">
        <div class="pill ${sub==='mano'?'active':''}" data-sub="mano">Mano de obra (4)</div>
        <div class="pill ${sub==='repuestos'?'active':''}" data-sub="repuestos">Repuestos (1)</div>
      </div>
      ${sub==='mano' ? manoObra : repuestos}
      <div class="card">
        <div class="card-title">Totales</div>
        <div class="row"><span class="label">Total orden</span><span class="val">$123.998</span></div>
      </div>`;
  }
  if(section==='imagenes'){
    return `<div class="card"><div class="card-title">Imágenes (2/10)</div><div class="row"><span class="label">2 fotos cargadas</span></div></div>`;
  }
  if(section==='pagos'){
    return `<div class="card"><div class="card-title">Pagos</div><div class="row"><span class="label">Abonado</span><span class="val">$0</span></div><div class="row"><span class="label">Saldo</span><span class="val">$123.998</span></div></div>`;
  }
}

function renderDatosContent(section, sub){
  if(section==='contactos'){
    const proveedores = `
      <div class="card">
        <div class="row"><span class="label">Repuestos Sur</span><span class="val">Editar</span></div>
      </div>`;
    const compradores = `
      <div class="card">
        <div class="row"><span class="label">Diego</span><span class="val">+56 9 4152 9250</span></div>
      </div>`;
    const mecanicos = `
      <div class="card">
        <div class="row"><span class="label">Fabiola Fuentes</span><span class="val">bono</span></div>
        <div class="row"><span class="label">Mecánico Diego N.</span><span class="val">bono</span></div>
        <div class="row"><span class="label">Raúl Toranzo</span><span class="val">bono</span></div>
      </div>
      <div class="card">
        <div class="card-title">Reporte bono · Mensual</div>
        <div class="row"><span class="label">Total bonos</span><span class="val">$2.539</span></div>
        <div class="row"><span class="label">Raúl Toranzo · GJGW33</span><span class="val">$2.539</span></div>
      </div>`;
    const map = {proveedores, compradores, mecanicos};
    return `
      <div class="pill-tabs" id="subTabs">
        <div class="pill ${sub==='proveedores'?'active':''}" data-sub="proveedores">Proveedores</div>
        <div class="pill ${sub==='compradores'?'active':''}" data-sub="compradores">Compradores</div>
        <div class="pill ${sub==='mecanicos'?'active':''}" data-sub="mecanicos">Mecánicos</div>
      </div>
      ${map[sub]}`;
  }
  if(section==='stock'){
    const bodega = `
      <div class="card">
        <div class="row"><span class="label">Alternador modular · Stock 4</span><span class="val">$15.000</span></div>
        <div class="row"><span class="label">Bujías · Stock 41</span><span class="val">$1.500</span></div>
        <div class="row"><span class="label">Filtro Aire · Stock 12</span><span class="val">$18.000</span></div>
      </div>`;
    const movimientos = `
      <div class="card">
        <div class="row"><span class="label">Entrada · Bujías x20</span><span class="val">Hoy</span></div>
        <div class="row"><span class="label">Salida · Alternador x1</span><span class="val">Ayer</span></div>
      </div>`;
    const compras = `
      <div class="card">
        <div class="row"><span class="label">OC #221 · Proveedor Sur</span><span class="val">$85.000</span></div>
      </div>`;
    const map = {bodega, movimientos, compras};
    return `
      <div class="pill-tabs" id="subTabs">
        <div class="pill ${sub==='bodega'?'active':''}" data-sub="bodega">Bodega</div>
        <div class="pill ${sub==='movimientos'?'active':''}" data-sub="movimientos">Movimientos</div>
        <div class="pill ${sub==='compras'?'active':''}" data-sub="compras">Compras</div>
      </div>
      ${map[sub]}`;
  }
  if(section==='finanzas'){
    return `
      <div class="card">
        <div class="card-title">Resumen financiero</div>
        <div class="row"><span class="label">Ventas</span><span class="val">$238.200</span></div>
        <div class="row"><span class="label">Ganancia</span><span class="val">$159.200</span></div>
        <div class="row"><span class="label">Margen</span><span class="val">67%</span></div>
      </div>`;
  }
}

function buildBottomNav(){
  const app = APPS[currentApp];
  const iconNavEl = document.getElementById('bottomnav');
  const segNavWrapTopEl = document.getElementById('segmentnavWrapTop');
  const orderStripEl = document.getElementById('orderStrip');

  // Ocultar todo primero
  iconNavEl.style.display = 'none';
  segNavWrapTopEl.style.display = 'none';
  orderStripEl.style.display = currentApp === 'ot' ? 'flex' : 'none';

  if(currentApp === 'ot'){
    segNavWrapTopEl.style.display = 'block';

    const targetSegEl = document.getElementById('segmentnavTop');
    targetSegEl.innerHTML = app.sections.map(s=>`
      <div class="seg-item ${s.key===activeSection?'active':''}" data-k="${s.key}">${s.label}</div>`).join('');
    targetSegEl.querySelectorAll('.seg-item').forEach(item=>{
      item.addEventListener('click',()=>{activeSection=item.dataset.k; render();});
    });
  } else {
    // Módulos independientes -> íconos sueltos, cada uno un destino
    iconNavEl.style.display = 'flex';

    iconNavEl.innerHTML = app.sections.map(s=>`
      <div class="bn-item ${s.key===activeSection?'active':''}" data-k="${s.key}">
        ${ICONS[s.key]}
        <span>${s.label}</span>
      </div>`).join('');
    iconNavEl.querySelectorAll('.bn-item').forEach(item=>{
      item.addEventListener('click',()=>{activeSection=item.dataset.k; render();});
    });
  }
}

function render(){
  const contentEl = document.getElementById('content');
  const sub = subPill[activeSection];

  contentEl.innerHTML = currentApp==='ot'
    ? renderOTContent(activeSection, sub)
    : renderDatosContent(activeSection, sub);

  const subTabsEl = document.getElementById('subTabs');
  if(subTabsEl){
    subTabsEl.querySelectorAll('.pill').forEach(p=>{
      p.addEventListener('click',()=>{subPill[activeSection]=p.dataset.sub; render();});
    });
  }

  document.getElementById('topSubtitle').textContent = APPS[currentApp].subtitle;
  document.getElementById('backBtn').style.visibility = 'visible';

  buildBottomNav();
}

document.getElementById('appSwitcher').addEventListener('click',(e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#appSwitcher button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentApp = btn.dataset.app;
  activeSection = APPS[currentApp].defaultSection;
  render();
});

render();

document.getElementById('shareBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  const menu = document.getElementById('shareMenu');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
});
document.addEventListener('click', ()=>{
  document.getElementById('shareMenu').style.display = 'none';
});
document.getElementById('shareMenu').addEventListener('click', (e)=> e.stopPropagation());

document.getElementById('hamburgerBtn').addEventListener('click', ()=>{
  document.querySelector('#appSwitcher button[data-app="datos"]').click();
});
</script>

</body>
</html>
